<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Journey | Interactive VIP Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
    
        :root {
            --primary: #2563eb;
            --accent: #38bdf8;
            --bg: #f4f6f9;
            --header-bg: #1e293b;
            --card-white: #ffffff;
            --text-dark: #333;
            --text-dim: #555;
        }

    
        body.dark {
            --bg: #0f172a;
            --card-white: #1e293b;
            --text-dark: #f1f5f9;
            --text-dim: #94a3b8;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: var(--bg);
            color: var(--text-dark);
            transition: 0.3s ease;
            min-height: 100vh;
        }

        header {
            background: var(--header-bg);
            color: white;
            padding: 20px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h1 { font-size: 24px; cursor: pointer; }
        header h1 span { color: var(--accent); }

        nav { display: flex; align-items: center; gap: 15px; }
        nav a { color: white; text-decoration: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        nav a:hover { color: var(--accent); }

        .container { padding: 20px 10%; max-width: 1400px; margin: auto; }

        .hero { text-align: center; padding: 40px 20px; }
        .hero h2 { font-size: 35px; margin-bottom: 10px; }
        
        .search-box { margin-top: 20px; }
        .search-box input {
            padding: 12px 20px;
            width: 60%;
            max-width: 500px;
            border: 1px solid #ccc;
            border-radius: 30px;
            outline: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .animate-in { animation: slideUp 0.4s ease forwards; }
        @keyframes slideUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }

    
        .card {
            background: var(--card-white);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: 0.3s;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .card:hover { transform: translateY(-8px); border-color: var(--primary); }
        .card h3 { margin-bottom: 10px; color: var(--primary); }
        .card p { color: var(--text-dim); line-height: 1.5; }

        /* Detail Page View */
        .detail-view {
            background: var(--card-white);
            padding: 40px;
            border-radius: 20px;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .back-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .section-title {
            margin-top: 40px;
            font-size: 28px;
            border-left: 6px solid var(--primary);
            padding-left: 15px;
        }

        button.mode-toggle {
            padding: 8px 15px;
            background: transparent;
            border: 1px solid white;
            color: white;
            border-radius: 20px;
            cursor: pointer;
        }

        footer {
            margin-top: 60px;
            padding: 30px;
            background: var(--header-bg);
            color: white;
            text-align: center;
        }

    </style>
</head>
<body>

<header>
    <h1 onclick="renderMain('topics')">Coding<span>Journey</span></h1>
    <nav>
        <a onclick="renderMain('topics')">Topics</a>
        <a onclick="renderMain('news')">News</a>
        <a onclick="renderMain('tips')">Daily Tips</a>
        <button class="mode-toggle" onclick="toggleMode()">🌙 Mode</button>
    </nav>
</header>

<div id="hero-section">
    <section class="hero">
        <h2>Welcome to Coding Journey</h2>
        <p>Your interactive guide to the latest in programming and technology.</p>
        <div class="search-box">
            <input type="text" id="search" placeholder="Search our knowledge base..." onkeyup="searchContent()">
        </div>
    </section>
</div>

<div class="container" id="app-content">
    </div>

<footer>
    <p>© 2026 Coding Journey | Built for Excellence & Innovation</p>
</footer>

<script>
    
    const db = {
        topics: [
            { id: 1, title: "HTML5 Structure", short: "Build the foundation of the web.", detail: "Learn semantic HTML tags like &lt;article&gt;, &lt;section&gt;, and &lt;nav&gt;. In 2026, proper structure is vital for both SEO and how AI models interpret your content." },
            { id: 2, title: "Modern CSS3", short: "Style with layout and animations.", detail: "Go beyond basic colors. Master Flexbox and Grid. Explore Container Queries which allow elements to style themselves based on their parent size, not just the screen." },
            { id: 3, title: "JavaScript ES2026", short: "Interactive and dynamic logic.", detail: "The brain of the web. Learn about Async/Await, high-order functions, and how to use modern APIs to fetch live data from the cloud." },
            { id: 4, title: "Git & Collaboration", short: "Version control for teams.", detail: "Git is the time machine of coding. Learn how to manage branches, merge code, and contribute to Open Source projects on GitHub." },
            { id: 5, title: "Cyber Security", short: "Protect your users and data.", detail: "Security isn't an afterthought. Learn about CSRF protection, sanitizing user input, and the importance of HTTPS in modern web apps." },
            { id: 6, title: "Cloud Integration", short: "Scalable hosting solutions.", detail: "Connect your apps to AWS, Vercel, or Netlify. Learn how serverless functions work to keep your applications running fast globally." }
        ],
        news: [
            { id: 1, title: "AI Assistant Evolution", short: "The latest in AI dev tools.", detail: "Industry reports show that 80% of code in 2026 is partially written by AI assistants, allowing developers to focus on high-level architecture rather than repetitive syntax." },
            { id: 2, title: "Quantum Computing News", short: "The first stable JS library for QC.", detail: "Research labs have released a simplified JavaScript library for simulating quantum circuits, bringing quantum logic to the browser environment." },
            { id: 3, title: "Web 4.0 Launch", short: "Decentralized internet standard.", detail: "The W3C has finalized new protocols for decentralized identity, making passwords a thing of the past for modern web applications." }
        ],
        tips: [
            { id: 1, title: "Clean Code Habit", short: "The 15-line rule.", detail: "If your function is longer than 15 lines, it's doing too much. Break it down into smaller pieces to make your code easier to debug and test." },
            { id: 2, title: "The 20-20-20 Rule", short: "Protect your vision.", detail: "Every 20 minutes, look at something 20 feet away for at least 20 seconds. This prevents eye strain, which is a common issue for professional coders." },
            { id: 3, title: "Rubber Duck Debugging", short: "The power of speaking aloud.", detail: "Explain your code out loud to a rubber duck (or a colleague). Often, the act of vocalizing the problem helps you find the logic error yourself." }
        ]
    };

    let currentCategory = 'topics';

    

    function renderMain(category) {
        currentCategory = category;
        const container = document.getElementById('app-content');
        const hero = document.getElementById('hero-section');
        hero.style.display = "block"; // Show hero on main lists

        let title = category === 'topics' ? "Coding Topics" : category === 'news' ? "Latest Tech News" : "Daily Pro Tips";
        
        let html = `<h2 class="section-title animate-in">${title}</h2><div class="grid animate-in">`;
        
        db[category].forEach(item => {
            html += `
                <div class="card" onclick="renderDetail('${category}', ${item.id})">
                    <h3>${item.title}</h3>
                    <p>${item.short}</p>
                </div>`;
        });
        
        html += `</div>`;
        container.innerHTML = html;
        window.scrollTo(0,0);
    }

    function renderDetail(category, id) {
        const item = db[category].find(x => x.id === id);
        const container = document.getElementById('app-content');
        const hero = document.getElementById('hero-section');
        
        hero.style.display = "none"; // Hide hero to focus on detail

        container.innerHTML = `
            <div class="animate-in">
                <button class="back-btn" onclick="renderMain('${category}')">← Back to ${category}</button>
                <div class="detail-view">
                    <h1 style="color:var(--primary); margin-bottom: 20px;">${item.title}</h1>
                    <p style="font-size: 1.2rem; line-height:1.8;">${item.detail}</p>
                    <div style="margin-top: 40px; border-top: 1px solid #eee; padding-top: 20px;">
                        <small>Lesson ID: 2026-0${item.id} | Coding Journey VIP Presentation</small>
                    </div>
                </div>
            </div>
        `;
        window.scrollTo(0,0);
    }


    function toggleMode() {
        document.body.classList.toggle("dark");
        const btn = document.querySelector('.mode-toggle');
        btn.innerText = document.body.classList.contains("dark") ? "☀️ Mode" : "🌙 Mode";
    }

    function searchContent() {
        let input = document.getElementById("search").value.toLowerCase();
        let cards = document.querySelectorAll(".card");
        cards.forEach(card => {
            let text = card.innerText.toLowerCase();
            card.style.display = text.includes(input) ? "block" : "none";
        });
    }

    // Initialize
    window.onload = () => renderMain('topics');
</script>

</body>

</html>
